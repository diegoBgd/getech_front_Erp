<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gatech ERP</title>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-navy-950 dark:text-navy-50">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <script>
      // 💡 SÉCURITÉ DE SÉCURITÉ IMMÉDIATE AU CHARGEMENT DE LA PAGE
      window.addEventListener('error', function(event) {
        if (event.message && (event.message.includes('Network Error') || event.message.includes('ERR_CONNECTION_REFUSED'))) {
          sessionStorage.setItem('gatech_v3_clear', 'true');
        }
      }, true);
    </script>
  </body>
</html>
